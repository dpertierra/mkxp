# Build manual de los tres ejecutables que distribuye La Base de Sky.
#
# A diferencia de autobuild.yml, que solo dispara en las ramas 'dev' y
# 'autobuild', esta se lanza a mano desde cualquier rama:
#   GitHub -> Actions -> "Build all platforms" -> Run workflow -> (elegir rama)
#
# Comparte los mismos pasos y las mismas claves de cache que autobuild.yml, asi
# que si esa ya construyo las dependencias, esta las reutiliza y solo recompila
# el motor.
name: Build all platforms

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Construir Windows (Game.exe)'
        type: boolean
        default: true
      linux:
        description: 'Construir Linux (Game_Linux)'
        type: boolean
        default: true
      macos:
        description: 'Construir macOS (Z-universal.app.zip)'
        type: boolean
        default: true

jobs:
  build-windows:
    name: Windows
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Sanitize ref name for artifact
        shell: bash
        run: echo "REF_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Disable Defender real-time scanning
        # Real-time scanning of every compiler output makes msys2 builds crawl on hosted runners.
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-openssl

      - name: Pin msys2-runtime 3.6.9
        # msys2-runtime 3.6.10+ regression makes make/git hang at random (msys2/msys2-runtime#362).
        shell: msys2 {0}
        run: |
          pacman -Q msys2-runtime msys2-runtime-devel || true
          base=https://repo.msys2.org/msys/x86_64
          pkgs="$base/msys2-runtime-3.6.9-2-x86_64.pkg.tar.zst"
          if pacman -Q msys2-runtime-devel >/dev/null 2>&1; then pkgs="$pkgs $base/msys2-runtime-devel-3.6.9-2-x86_64.pkg.tar.zst"; fi
          pacman -U --noconfirm $pkgs

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          # Diagnostics: if the build stalls, dump live processes and the latest mkmf logs.
          timeout 30m make USE_SYSTEM_OPENSSL=1 || {
            rc=$?
            echo "::group::processes"; ps -efW || ps -ef; echo "::endgroup::"
            for f in $(ls -t downloads/mingw64/ruby/ext/*/mkmf.log downloads/mingw64/ruby/.bundle/gems/*/ext/*/mkmf.log 2>/dev/null | head -3); do
              echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"
            done
            exit $rc
          }

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          meson setup build
          cd build
          ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir build/artifact
          cd build/artifact
          cp /ucrt64/bin/libgomp-1.dll .
          cp /ucrt64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-ucrt-ruby400.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/4.0.0 .
          mv ./4.0.0 ./stdlib
          cp ../mkxp-z.exe .
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows.${{env.REF_NAME}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact

  build-linux:
    name: Ubuntu 22.04 x86_64
    if: ${{ inputs.linux }}
    runs-on: ubuntu-22.04
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Sanitize ref name for artifact
        shell: bash
        run: echo "REF_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            linux/build-x86_64
            linux/downloads
          key: lin-x86_64-${{ hashFiles('linux/Makefile') }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install git wget build-essential cmake meson autoconf automake libtool pkg-config ruby rustc bison xxd patchelf zlib1g-dev libbz2-dev xorg-dev libgl1-mesa-dev libasound2-dev libpulse-dev -y

      - name: Drop stale LLVM bfd plugin
        # ar auto-loads /usr/lib/bfd-plugins; an old LLVMgold.so can't read the newer
        # LLVM bitcode in YJIT's Rust objects ("LLVM ERROR: Invalid encoding").
        run: |
          ls -la /usr/lib/bfd-plugins || true
          sudo rm -f /usr/lib/bfd-plugins/LLVMgold*.so
          rustc --version

      - name: Build everything else
        run: |
          cd linux
          make

      - name: Build executable
        run: |
          source linux/vars.sh
          meson setup build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local
          cd build
          ninja
          ninja install

      - name: Prepare archive
        run: |
          cd build/local
          cp -r ../../linux/build-x86_64/lib/ruby/4.0.0 .
          mv ./4.0.0 ./stdlib
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.linux.ubuntu.22.04.x86_64.${{env.REF_NAME}}-${{steps.short-sha.outputs.sha}}
          path: build/local

  build-macos:
    name: macOS
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      - name: Sanitize ref name for artifact
        shell: bash
        run: echo "REF_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Remove pre-existing homebrew packages
        run: brew remove --force $(brew list)

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            macos/Dependencies/build-macosx-x86_64
            macos/Dependencies/build-macosx-arm64
            macos/Dependencies/build-macosx-universal
            macos/Dependencies/downloads
          key: mac-${{ hashFiles('macos/Dependencies/*.make', 'macos/Dependencies/*.sh') }}

      - name: Install Homebrew tools
        run: |
          cd macos/Dependencies
          brew bundle

      - name: Build all dependencies
        run: |
          cd macos/Dependencies
          ./setup.sh

      - name: Build app
        run: |
          cd macos
          xcodebuild -project mkxp-z.xcodeproj -configuration "Release" -scheme "Universal" -derivedDataPath "$GITHUB_WORKSPACE/build"

      - name: Compress app
        run: |
          cd build/Build/Products/Release
          cp ../../../../assets/LICENSE.mkxp-z-with-https.txt ./Z-universal.app/
          ditto -c -k --sequesterRsrc --keepParent Z-universal.app Z-universal.app.zip

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.macos.${{env.REF_NAME}}-${{steps.short-sha.outputs.sha}}
          path: build/Build/Products/Release/Z-universal.app.zip
