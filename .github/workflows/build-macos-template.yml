name: Build macOS template

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS template
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            macos/Dependencies/build-macosx-x86_64
            macos/Dependencies/build-macosx-arm64
            macos/Dependencies/build-macosx-universal
            macos/Dependencies/downloads
          key: mac-${{ hashFiles('macos/Dependencies/*.make', 'macos/Dependencies/*.sh', 'macos/Dependencies/*.patch') }}

      - name: Install Homebrew tools
        run: |
          cd macos/Dependencies
          brew bundle

      - name: Build dependencies
        run: |
          cd macos/Dependencies
          ./setup.sh

      - name: Build app
        run: |
          cd macos
          xcodebuild -project mkxp-z.xcodeproj \
            -configuration Release -scheme Universal \
            -derivedDataPath "$GITHUB_WORKSPACE/build"

      - name: Clean game folder
        run: rm -rf build/Build/Products/Release/Z-universal.app/Contents/Game/*

      - name: Zip template
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            Z-universal.app Z-universal-macos-template.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Z-universal-macos-template
          path: build/Build/Products/Release/Z-universal-macos-template.zip
