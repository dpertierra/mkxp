# APK base de Android (sin juego) para empaquetar con tools/crear_release.rb
# de La Base de Sky. Lo llaman autobuild.yml y build-all.yml, y tambien se puede
# lanzar a mano: GitHub -> Actions -> "Android base APK" -> Run workflow.
#
# Las dependencias nativas (android/deps, ~40 min la primera vez) se guardan en
# cache con la misma clave mientras no cambie android/deps/Makefile.
name: Android base APK

on:
  workflow_dispatch:
  workflow_call:

env:
  NDK_VERSION: 30.0.16248370

jobs:
  build-android-base:
    name: Android (APK base)
    runs-on: ubuntu-24.04
    steps:
      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 7

      # Nombre de rama apto para artefactos: upload-artifact rechaza '/'.
      - id: ref
        shell: bash
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential cmake autoconf automake libtool \
            pkg-config ruby xxd unzip python3-venv

      - name: Install Meson and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install meson==1.12.1 ninja==1.13.2
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK, platform and build-tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            android/deps/build-arm64
            android/deps/downloads
          key: android-arm64-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/Makefile') }}

      - name: Build native dependencies
        run: make -C android/deps

      - name: Fetch SDL2 Java sources
        run: ./android/fetch-sdl-java.sh

      - name: Build engine libraries
        run: ./android/build-native.sh

      - name: Build base APK
        run: ./android/build-base-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mkxpz-android-base.${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || steps.ref.outputs.name }}-${{ steps.short-sha.outputs.sha }}
          path: android/build-games/mkxpz-android-base.apk
