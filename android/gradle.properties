org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Keep launcher PNG paths stable for the Ruby APK repackager.
android.enableResourceOptimizations=false

# AGP 8.7 knows compileSdk 35; we compile against the installed API 36
# platform but still target API 35 (see app/build.gradle.kts).
android.suppressUnsupportedCompileSdk=36

# Default application identity. Override per build with:
#   ./gradlew assembleDebug -Pmkxpz.applicationId=com.example.mygame
# or by exporting MKXPZ_APPLICATION_ID.
mkxpz.applicationId=io.github.mkxpz.android
mkxpz.versionCode=1
mkxpz.versionName=1.0.0

# Fangame Launcher save provider. Signing certificate(s) of com.fangamelauncher.app
# the provider trusts: SHA-256, uppercase hex without colons, comma separated.
# Default: the launcher's release certificate (CN=Fangame Launcher).
# Add the debug certificate of a local launcher build after a comma if needed.
mkxpz.launcherCertSha256=EEAA788FFC0A54720EECA7361E513F1F0CBC38FE529F770AD72523043BBFC57E
# Debug only: also accept the adb shell uid, to try the provider with `adb shell content`.
# Ignored (forced off) for the base APK. Never ship a game built with true.
mkxpz.allowShellCaller=false
