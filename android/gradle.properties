org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7 knows compileSdk 35; we compile against the installed API 36
# platform but still target API 35 (see app/build.gradle.kts).
android.suppressUnsupportedCompileSdk=36

# Default application identity. Override per build with:
#   ./gradlew assembleDebug -Pmkxpz.applicationId=com.example.mygame
# or by exporting MKXPZ_APPLICATION_ID.
mkxpz.applicationId=io.github.mkxpz.android
mkxpz.versionCode=1
mkxpz.versionName=1.0.0
