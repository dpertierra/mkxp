# Meson cross file: Android arm64-v8a (aarch64-linux-android26).
#
# Put the NDK toolchain bin directory on PATH (build-native.sh does this).

[binaries]
c = 'aarch64-linux-android26-clang'
cpp = 'aarch64-linux-android26-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'
cmake = 'cmake'

[built-in options]
c_args = ['--target=aarch64-linux-android26']
cpp_args = ['--target=aarch64-linux-android26']
c_link_args = ['--target=aarch64-linux-android26']
cpp_link_args = ['--target=aarch64-linux-android26']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
