# Meson cross file: Android arm64-v8a (aarch64-linux-android26).
#
# The NDK path is the only thing that has to be edited here. Both NDK r27 and
# r30 ship the same clang wrappers, so switching versions means changing the
# directory name only:
#
#   r27: /home/diego/Android/Sdk/ndk/27.2.12479018
#   r30: /home/diego/Android/Sdk/ndk/30.0.16248370
#
#   sed -i 's|ndk/[0-9.]*/|ndk/30.0.16248370/|' android/meson-cross-arm64.ini
#
# The last path component of the toolchain directory depends on the host
# machine: linux-x86_64 (Linux), darwin-x86_64 (macOS), windows-x86_64.

[binaries]
c = '/home/diego/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
cpp = '/home/diego/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
ar = '/home/diego/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/home/diego/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkgconfig = 'pkg-config'
cmake = 'cmake'

[built-in options]
c_args = ['--target=aarch64-linux-android26']
cpp_args = ['--target=aarch64-linux-android26']
c_link_args = ['--target=aarch64-linux-android26']
cpp_link_args = ['--target=aarch64-linux-android26']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
